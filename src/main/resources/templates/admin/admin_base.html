<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">

<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

    <div class="text-center py-4 border-bottom">
        <h4>
            <i class="fa-solid fa-store"></i>
            Admin Panel
        </h4>
    </div>

    <ul class="nav flex-column mt-3">

        <!-- Dashboard -->

        <li class="nav-item">
            <a href="/admin/"
               class="nav-link">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>
        </li>

        <!-- Product -->

        <li class="nav-item">

            <a class="nav-link"
               data-bs-toggle="collapse"
               href="#productMenu">
                <i class="fa-solid fa-box"></i>
                Products
                <i class="fa-solid fa-chevron-down float-end"></i>
            </a>

            <div class="collapse"
                 id="productMenu">
                <ul class="nav flex-column ms-4">
                    <li>
                        <a href="/products/add"
                           class="nav-link">
                            Add Product
                        </a>
                    </li>

                    <li>
                        <a href="/products/view"
                           class="nav-link">
                            View Products
                        </a>
                    </li>

                </ul>

            </div>

        </li>

        <!-- Category -->

        <li class="nav-item">

            <a class="nav-link"
               data-bs-toggle="collapse"
               href="#categoryMenu">

                <i class="fa-solid fa-list"></i>
                Categories

                <i class="fa-solid fa-chevron-down float-end"></i>

            </a>

            <div class="collapse"
                 id="categoryMenu">

                <ul class="nav flex-column ms-4">

                    <li>
                        <a href="/categories/add"
                           class="nav-link">
                            Add Category
                        </a>
                    </li>

                    <li>
                        <a href="/categories/view"
                           class="nav-link">
                            View Categories
                        </a>
                    </li>

                </ul>

            </div>

        </li>

        <!-- Orders -->

        <li class="nav-item">
            <a href="/order/get-all"
               class="nav-link">

                <i class="fa-solid fa-cart-shopping"></i>
                Orders

            </a>
        </li>

        <!-- Users -->

        <li class="nav-item">
            <a href="/admin/users?type=1"
               class="nav-link">

                <i class="fa-solid fa-users"></i>
                Users

            </a>
        </li>

        <!-- Admin -->

        <li class="nav-item">

            <a class="nav-link"
               data-bs-toggle="collapse"
               href="#adminMenu">

                <i class="fa-solid fa-user-shield"></i>
                Admins

                <i class="fa-solid fa-chevron-down float-end"></i>

            </a>

            <div class="collapse"
                 id="adminMenu">

                <ul class="nav flex-column ms-4">

                    <li>
                        <a href="/admin/add-admin"
                           class="nav-link">
                            Add Admin
                        </a>
                    </li>

                    <li>
                        <a href="/admin/users?type=2"
                           class="nav-link">
                            View Admins
                        </a>
                    </li>

                </ul>

            </div>

        </li>

    </ul>

</div>

<!-- Main Content -->

<div class="main-content">

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg top-navbar px-4">

        <div class="container-fluid">

        <span class="navbar-brand fw-bold">
            Ecommerce Admin
        </span>

            <div class="dropdown">

                <a class="admin-profile d-flex align-items-center text-decoration-none"
                   href="#"
                   data-bs-toggle="dropdown">

                    <img th:if="${user != null}"
                         th:src="@{'/img/profile_img/'+${user.profileImage}}"
                         class="rounded-circle"
                         width="45"
                         height="45">

                    <span th:if="${user != null}"
                          class="admin-name ms-3">
    [[${user.name}]]
</span>

                </a>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <a class="dropdown-item"
                           href="/admin/profile">
                            <i class="fa-solid fa-user me-2"></i>
                            Profile
                        </a>
                    </li>

                    <li><hr class="dropdown-divider"></li>

                    <li>
                        <a class="dropdown-item text-danger"
                           href="/logout">
                            <i class="fa-solid fa-right-from-bracket me-2"></i>
                            Logout
                        </a>
                    </li>

                </ul>

            </div>
        </div>

    </nav>

    <!-- Dynamic Content -->

    <div class="page-content">

        <div th:replace="${content}"></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
