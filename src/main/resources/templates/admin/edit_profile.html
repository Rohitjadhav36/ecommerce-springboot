<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section})}">

<body>

<section>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow border-0">

                    <div class="card-header bg-primary text-white text-center">

                        <h4 class="mb-0">
                            Update Profile
                        </h4>

                    </div>

                    <div class="card-body p-4">

                        <form action="/admin/update-profile"
                              method="post">

                            <input type="hidden"
                                   name="id"
                                   th:value="${user.id}">

                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input type="text"
                                       name="name"
                                       class="form-control"
                                       th:value="${user.name}"
                                       required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       th:value="${user.email}"
                                       readonly>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Mobile Number
                                </label>

                                <input type="text"
                                       name="mobileNumber"
                                       class="form-control"
                                       th:value="${user.mobileNumber}">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Address
                                </label>

                                <input type="text"
                                       name="address"
                                       class="form-control"
                                       th:value="${user.address}">

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        City
                                    </label>

                                    <input type="text"
                                           name="city"
                                           class="form-control"
                                           th:value="${user.city}">

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        State
                                    </label>

                                    <input type="text"
                                           name="state"
                                           class="form-control"
                                           th:value="${user.state}">

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Pincode
                                </label>

                                <input type="text"
                                       name="pincode"
                                       class="form-control"
                                       th:value="${user.pincode}">

                            </div>

                            <button type="submit"
                                    class="btn btn-primary w-100">

                                Update Profile

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

</body>
</html>
