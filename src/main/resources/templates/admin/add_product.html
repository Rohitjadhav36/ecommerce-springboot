<!DOCTYPE html>

<html lang="en"
	  xmlns:th="http://www.thymeleaf.org"
	  th:replace="~{admin/admin_base :: layout(~{::section})}">

<head>
	<meta charset="ISO-8859-1">
	<title>Add Product</title>
</head>

<body>

<section>

	<div class="container mt-5">

		<div class="row justify-content-center">

			<div class="col-lg-8">

				<div class="card shadow-lg border-0">

					<div class="card-header bg-primary text-white text-center py-3">

						<h3 class="mb-0 fw-bold">
							<i class="fa-solid fa-box-open me-2"></i>
							Add Product
						</h3>

					</div>

					<div class="card-body p-4">

						<!-- Success Message -->

						<th:block th:if="${session.succMsg}">

							<div class="alert alert-success">

								[[${session.succMsg}]]

							</div>

							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}">
							</th:block>

						</th:block>

						<!-- Error Message -->

						<th:block th:if="${session.errorMsg}">

							<div class="alert alert-danger">

								[[${session.errorMsg}]]

							</div>

							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}">
							</th:block>

						</th:block>

						<form action="/products/save"
							  method="post"
							  enctype="multipart/form-data">

							<!-- Product Title -->

							<div class="mb-3">

								<label class="form-label fw-semibold">
									Product Title
								</label>

								<input type="text"
									   name="title"
									   class="form-control form-control-lg"
									   placeholder="Enter Product Title"
									   required>

							</div>

							<!-- Description -->

							<div class="mb-3">

								<label class="form-label fw-semibold">
									Product Description
								</label>

								<textarea rows="4"
										  class="form-control"
										  name="description"
										  placeholder="Enter Product Description"
										  required></textarea>

							</div>

							<!-- Category -->

							<div class="mb-3">

								<label class="form-label fw-semibold">
									Category
								</label>

								<select class="form-select"
										name="category"
										required>

									<option value="">
										Select Category
									</option>

									<option th:each="c : ${categories}"
											th:value="${c.id}"
											th:text="${c.name}">
									</option>

								</select>

							</div>

							<!-- Price & Stock -->

							<div class="row">

								<div class="col-md-6 mb-3">

									<label class="form-label fw-semibold">
										Price
									</label>

									<input type="number"
										   name="price"
										   class="form-control"
										   placeholder="Enter Price"
										   required>

								</div>

								<div class="col-md-6 mb-3">

									<label class="form-label fw-semibold">
										Stock
									</label>

									<input type="number"
										   name="stock"
										   class="form-control"
										   placeholder="Enter Stock"
										   required>

								</div>

							</div>

							<!-- Status -->

							<div class="mb-3">

								<label class="form-label fw-semibold">
									Status
								</label>

								<div class="d-flex gap-4 mt-2">

									<div class="form-check">

										<input class="form-check-input"
											   type="radio"
											   checked
											   value="true"
											   name="isActive"
											   id="active">

										<label class="form-check-label"
											   for="active">
											Active
										</label>

									</div>

									<div class="form-check">

										<input class="form-check-input"
											   type="radio"
											   value="false"
											   name="isActive"
											   id="inactive">

										<label class="form-check-label"
											   for="inactive">
											Inactive
										</label>

									</div>

								</div>

							</div>

							<!-- Product Image -->

							<div class="mb-4">

								<label class="form-label fw-semibold">
									Product Image
								</label>

								<input type="file"
									   name="file"
									   class="form-control"
									   required>

							</div>

							<!-- Buttons -->

							<div class="row">

								<div class="col-md-6">

									<button type="submit"
											class="btn btn-primary w-100">

										<i class="fa-solid fa-floppy-disk me-2"></i>
										Save Product

									</button>

								</div>

								<div class="col-md-6">

									<a href="/products/view"
									   class="btn btn-outline-secondary w-100">

										<i class="fa-solid fa-arrow-left me-2"></i>
										Back

									</a>

								</div>

							</div>

						</form>

					</div>

				</div>

			</div>

		</div>

	</div>

</section>

</body>

</html>
