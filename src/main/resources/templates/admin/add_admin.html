<!DOCTYPE html>

<html lang="en"
	  xmlns:th="http://www.thymeleaf.org"
	  th:replace="~{admin/admin_base :: layout(~{::section})}">

<head>
	<meta charset="ISO-8859-1">
	<title>Add Admin</title>
</head>

<body>

<section>

	<div class="container mt-5">

		<div class="row justify-content-center">

			<div class="col-lg-8">

				<div class="card shadow-lg border-0">

					<!-- Header -->

					<div class="card-header bg-primary text-white text-center py-3">

						<h3 class="mb-0 fw-bold">
							<i class="fa-solid fa-user-shield me-2"></i>
							Add Admin
						</h3>

					</div>

					<div class="card-body p-4">

						<!-- Success Message -->

						<th:block th:if="${session.succMsg}">

							<div class="alert alert-success">

								[[${session.succMsg}]]

							</div>

							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}">
							</th:block>

						</th:block>

						<!-- Error Message -->

						<th:block th:if="${session.errorMsg}">

							<div class="alert alert-danger">

								[[${session.errorMsg}]]

							</div>

							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}">
							</th:block>

						</th:block>

						<form action="/admin/save-admin"
							  method="post"
							  enctype="multipart/form-data">

							<!-- Name & Mobile -->

							<div class="row">

								<div class="col-md-6 mb-3">

									<label class="form-label fw-semibold">
										Full Name
									</label>

									<input type="text"
										   name="name"
										   class="form-control"
										   required>

								</div>

								<div class="col-md-6 mb-3">

									<label class="form-label fw-semibold">
										Mobile Number
									</label>

									<input type="number"
										   name="mobileNumber"
										   class="form-control"
										   required>

								</div>

							</div>

							<!-- Email -->

							<div class="mb-3">

								<label class="form-label fw-semibold">
									Email
								</label>

								<input type="email"
									   name="email"
									   class="form-control"
									   required>

							</div>

							<!-- Address & City -->

							<div class="row">

								<div class="col-md-6 mb-3">

									<label class="form-label fw-semibold">
										Address
									</label>

									<input type="text"
										   name="address"
										   class="form-control"
										   required>

								</div>

								<div class="col-md-6 mb-3">

									<label class="form-label fw-semibold">
										City
									</label>

									<input type="text"
										   name="city"
										   class="form-control"
										   required>

								</div>

							</div>

							<!-- State & Pincode -->

							<div class="row">

								<div class="col-md-6 mb-3">

									<label class="form-label fw-semibold">
										State
									</label>

									<input type="text"
										   name="state"
										   class="form-control"
										   required>

								</div>

								<div class="col-md-6 mb-3">

									<label class="form-label fw-semibold">
										Pincode
									</label>

									<input type="number"
										   name="pincode"
										   class="form-control"
										   required>

								</div>

							</div>

							<!-- Password -->

							<div class="row">

								<div class="col-md-6 mb-3">

									<label class="form-label fw-semibold">
										Password
									</label>

									<input type="password"
										   name="password"
										   class="form-control"
										   required>

								</div>

								<div class="col-md-6 mb-3">

									<label class="form-label fw-semibold">
										Confirm Password
									</label>

									<input type="password"
										   name="cpassword"
										   class="form-control"
										   required>

								</div>

							</div>

							<!-- Profile Image -->

							<div class="mb-4">

								<label class="form-label fw-semibold">
									Profile Image
								</label>

								<input type="file"
									   name="img"
									   class="form-control">

							</div>

							<!-- Buttons -->

							<div class="row">

								<div class="col-md-6">

									<button type="submit"
											class="btn btn-primary w-100">

										<i class="fa-solid fa-user-plus me-2"></i>
										Register Admin

									</button>

								</div>

								<div class="col-md-6">

									<a href="/admin/"
									   class="btn btn-outline-secondary w-100">

										<i class="fa-solid fa-arrow-left me-2"></i>
										Back

									</a>

								</div>

							</div>

						</form>

					</div>

				</div>

			</div>

		</div>

	</div>

</section>

</body>

</html>
