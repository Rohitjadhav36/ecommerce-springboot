<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin_base :: layout(~{::section})}">

<head>

    <meta charset="ISO-8859-1">

    <title>Category Page</title>

</head>

<body>

<section>

    <div class="container-fluid py-4">

        <div class="row justify-content-center">

            <div class="col-lg-11">

                <div class="card shadow border-0 rounded-4">

                    <div class="card-header bg-primary text-white py-3">

                        <h3 class="mb-0 text-center fw-bold">
                            <i class="fa-solid fa-list me-2"></i>
                            Category Management
                        </h3>

                    </div>

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table align-middle table-hover">

                                <thead class="table-light">

                                <tr>
                                    <th>#</th>
                                    <th>Image</th>
                                    <th>Category Name</th>
                                    <th>Status</th>
                                    <th class="text-center">Actions</th>
                                </tr>

                                </thead>

                                <tbody>

                                <tr th:each="cat,c : ${categories}">

                                    <td class="fw-bold">
                                        [[${c.count}]]
                                    </td>

                                    <td>

                                        <img th:src="@{'/img/category_img/'+${cat.imageName}}"
                                             class="rounded shadow-sm category-img">

                                    </td>

                                    <td class="fw-semibold">
                                        [[${cat.name}]]
                                    </td>

                                    <td>

                                        <span th:if="${cat.isActive}"
                                              class="badge bg-success px-3 py-2">
                                            Active
                                        </span>

                                        <span th:unless="${cat.isActive}"
                                              class="badge bg-danger px-3 py-2">
                                            Inactive
                                        </span>

                                    </td>

                                    <td class="text-center">

                                        <a th:href="@{'/categories/edit/'+${cat.id}}"
                                           class="btn btn-primary btn-sm me-2">

                                            <i class="fa-solid fa-pen-to-square"></i>
                                            Edit

                                        </a>

                                        <a th:href="@{'/categories/delete/'+${cat.id}}"
                                           class="btn btn-danger btn-sm">

                                            <i class="fa-solid fa-trash"></i>
                                            Delete

                                        </a>

                                    </td>

                                </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
</body>

</html>
