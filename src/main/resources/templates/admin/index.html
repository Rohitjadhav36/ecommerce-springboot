<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  th:replace="~{admin/admin_base :: layout(~{::section})}">
<head>
	<meta charset="UTF-8">
</head>
<body>
<section>

	<div class="container-fluid mt-4">

		<div class="card shadow-lg border-0">

			<div class="card-header bg-primary text-white">

				<h3 class="mb-0">
					Order Management
				</h3>

			</div>

			<div class="card-body">

				<form action="/admin/" method="get">

					<div class="row mb-4">

						<div class="col-md-4">

							<input type="date"
								   name="orderDate"
								   class="form-control">

						</div>

						<div class="col-md-2">

							<button class="btn btn-primary w-100">

								Search

							</button>

						</div>

					</div>

				</form>

				<div class="table-responsive">

					<table class="table table-hover">

						<thead class="table-light">

						<tr>

							<th>#</th>
							<th>Order ID</th>
							<th>User ID</th>
							<th>Product</th>
							<th>Qty</th>
							<th>Total</th>
							<th>Status</th>
							<th>Date</th>

						</tr>

						</thead>

						<tbody>

						<tr th:each="o,c:${orders}">

							<td>[[${c.count}]]</td>

							<td>
								[[${o.orderId}]]
							</td>

							<td>

								<a th:href="@{'/admin/user/'+${o.user.id}}"
								   class="text-decoration-none">

									[[${o.user.id}]]

								</a>

							</td>

							<td>
								[[${o.product.title}]]
							</td>

							<td>
								[[${o.quantity}]]
							</td>

							<td>
								₹ [[${o.price * o.quantity}]]
							</td>

							<td>

                                <span class="badge bg-success"
									  th:text="${o.status}">
                                </span>

							</td>

							<td>
								[[${o.orderDate}]]
							</td>

						</tr>

						</tbody>

					</table>

				</div>

			</div>

		</div>

	</div>

</section>
</body>
</html>
