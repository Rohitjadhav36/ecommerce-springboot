<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  th:replace="~{admin/admin_base :: layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
</head>
<body>
<section>

	<div class="container-fluid mt-4">

		<div class="card shadow-lg border-0">

			<div class="card-header bg-primary text-white">

				<div class="d-flex justify-content-between align-items-center">

					<h3 class="mb-0">

						<i class="fa-solid fa-users me-2"></i>

						<span th:if="${userType==1}">
                            Users Management
                        </span>

						<span th:if="${userType==2}">
                            Admin Management
                        </span>

					</h3>

				</div>

			</div>

			<div class="card-body">

				<!-- Messages -->

				<th:block th:if="${session.succMsg}">
					<div class="alert alert-success">
						[[${session.succMsg}]]
					</div>
					<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
				</th:block>

				<th:block th:if="${session.errorMsg}">
					<div class="alert alert-danger">
						[[${session.errorMsg}]]
					</div>
					<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
				</th:block>

				<div class="table-responsive">

					<table class="table table-hover align-middle text-center">

						<thead class="table-light">

						<tr>

							<th>#</th>
							<th>Profile</th>
							<th>Name</th>
							<th>Email</th>
							<th>Mobile</th>
							<th>Address</th>
							<th>Status</th>
							<th>Action</th>

						</tr>

						</thead>

						<tbody>

						<tr th:each="u,c : ${users}">

							<td>
								[[${c.count}]]
							</td>

							<td>

								<img th:src="@{'/img/profile_img/'+${u.profileImage}}"
									 class="rounded-circle border"
									 width="60"
									 height="60">

							</td>

							<td class="fw-semibold">
								[[${u.name}]]
							</td>

							<td>
								[[${u.email}]]
							</td>

							<td>
								[[${u.mobileNumber}]]
							</td>

							<td style="max-width:250px;">
								[[${u.address}]],
								[[${u.city}]],
								[[${u.state}]]
								-
								[[${u.pincode}]]
							</td>

							<td>

                                <span th:if="${u.isEnable}"
									  class="badge bg-success">
                                    Active
                                </span>

								<span th:unless="${u.isEnable}"
									  class="badge bg-danger">
                                    Inactive
                                </span>

							</td>

							<td>

								<div class="d-flex justify-content-center gap-2">

									<a th:href="@{'/admin/updateSts?status=true&id='+${u.id}+'&type='+${userType}}"
									   class="btn btn-success btn-sm">

										<i class="fa-solid fa-check"></i>

									</a>

									<a th:href="@{'/admin/updateSts?status=false&id='+${u.id}+'&type='+${userType}}"
									   class="btn btn-danger btn-sm">

										<i class="fa-solid fa-ban"></i>

									</a>

								</div>

							</td>

						</tr>

						</tbody>

					</table>

				</div>

			</div>

		</div>

	</div>

</section>
</body>
</html>
