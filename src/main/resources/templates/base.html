<!DOCTYPE html>
<html lang="en"
	  xmlns:th="http://www.thymeleaf.org"
	  th:fragment="layout(content)">

<head>

	<meta charset="UTF-8">
	<meta name="viewport"
		  content="width=device-width, initial-scale=1.0">

	<title>Ecommerce Store</title>

	<!-- Bootstrap CSS -->

	<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet">

	<!-- Font Awesome -->

	<link rel="stylesheet"
		  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<!-- Custom CSS -->

	<link rel="stylesheet"
		  th:href="@{/css/style.css}">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">

	<div class="container">


		<!-- LOGO -->

		<a class="navbar-brand fw-bold fs-3"
		   th:href="@{/}">

			<i class="fa-solid fa-cart-shopping text-primary"></i>

			Ecommerce Store

		</a>



		<!-- MOBILE BUTTON -->

		<button class="navbar-toggler"
				type="button"
				data-bs-toggle="collapse"
				data-bs-target="#navbarContent">

			<span class="navbar-toggler-icon"></span>

		</button>



		<!-- NAVBAR CONTENT -->

		<div class="collapse navbar-collapse"
			 id="navbarContent">



			<!-- LEFT MENU -->

			<ul class="navbar-nav ms-4 mb-2 mb-lg-0">


				<!-- HOME -->

				<li class="nav-item">

					<a class="nav-link fw-semibold"
					   th:href="@{/}">

						Home

					</a>

				</li>



				<!-- PRODUCTS -->

				<li class="nav-item">

					<a class="nav-link fw-semibold"
					   th:href="@{/products}">

						Products

					</a>

				</li>



				<!-- CATEGORY -->

				<li class="nav-item dropdown">

					<a
							class="nav-link dropdown-toggle" href="#" role="button"
							data-bs-toggle="dropdown" aria-expanded="false"> Category </a>
					<ul class="dropdown-menu">
						<li th:each="c:${categorys}"><a class="dropdown-item"
														th:href="@{'/products?category='+${c.name}}">[[${c.name}]]</a></li>

					</ul>


					<ul class="dropdown-menu">


						<li th:each="c : ${categorys}">

							<a class="dropdown-item"
							   th:href="@{'/products?category='+${c.name}}">

								[[${c.name}]]

							</a>

						</li>

					</ul>

				</li>

			</ul>



			<!-- SEARCH BAR -->

			<form action="/products" method="get" class="d-flex mx-auto w-50">

				<div class="input-group">

					<input type="search"
						   name="category"
						   class="form-control"
						   placeholder="Search products...">

					<button type="submit" class="btn btn-dark">
						<i class="fa-solid fa-magnifying-glass"></i>
					</button>

				</div>

			</form>


			<!-- RIGHT SIDE -->

			<div class="d-flex align-items-center">

				<th:block th:if="${user==null}">

					<a th:href="@{/signin}"
					   class="btn btn-outline-dark me-2">

						Login

					</a>


					<a th:href="@{/register}"
					   class="btn btn-dark">

						Register

					</a>

				</th:block>

				<!-- USER LOGIN -->

				<th:block th:if="${user!=null}">


					<!-- CART -->

					<th:block th:if="${user.role=='ROLE_USER'}">

						<a th:href="@{/cart/view}"
						   class="text-dark me-4 fs-5 position-relative">

							<i class="fa-solid fa-cart-shopping"></i>

							<span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">

                                [[${countCart}]]

                            </span>

						</a>

					</th:block>



					<!-- USER DROPDOWN -->

					<div class="dropdown">

						<a class="btn btn-dark dropdown-toggle"
						   href="#"
						   role="button"
						   data-bs-toggle="dropdown">

							<i class="fa-solid fa-user"></i>

							[[${user.name}]]

						</a>



						<ul class="dropdown-menu dropdown-menu-end">

							<li th:if="${user.role=='ROLE_USER'}">

								<a class="dropdown-item"
								   th:href="@{/users/profile}">

									Profile

								</a>

							</li>


							<li th:if="${user.role=='ROLE_ADMIN'}">

								<a class="dropdown-item"
								   th:href="@{/users/profile}">

									Admin Profile

								</a>

							</li>


							<li th:if="${user.role=='ROLE_USER'}">

								<a class="dropdown-item"
								   th:href="@{/order/view}">

									My Orders

								</a>

							</li>


							<li>

								<a class="dropdown-item"
								   th:href="@{/logout}">

									Logout

								</a>

							</li>

						</ul>

					</div>

				</th:block>

			</div>

		</div>

	</div>

</nav>



<!-- ================= PAGE CONTENT ================= -->

<div th:replace="${content}"></div>



<!-- ================= FOOTER ================= -->

<div class="container-fluid bg-dark text-white text-center p-3 mt-5">

	<p class="mb-0">

		© 2026 Ecommerce Store | All Rights Reserved

	</p>

</div>



<!-- Bootstrap JS -->

<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

</script>

</body>

</html>
