<!DOCTYPE html>
<html lang="en"
	  xmlns:th="http://www.thymeleaf.org"
	  th:replace="~{base :: layout(~{::section})}">
<head>
	<meta charset="UTF-8">
</head>
<body>
<section>

	<div class="container mt-4">

		<h2 class="mb-4">Shopping Cart</h2>

		<div class="card shadow-sm">

			<div class="card-body">

				<div class="row border-bottom py-4 align-items-center"
					 th:each="cart : ${carts}">

					<!-- Image -->
					<div class="col-md-2 text-center">
						<img th:src="@{'/img/product_img/' + ${cart.product.image}}"
							 class="img-fluid rounded cart-img"
							 style="max-height:150px;">
					</div>

					<!-- Details -->
					<div class="col-md-7">

						<h5 th:text="${cart.product.title}"></h5>

						<p class="text-muted"
						   th:text="${cart.product.description}">
						</p>

						<span class="text-success fw-bold">
                            In Stock
                        </span>

						<div class="mt-3 d-flex align-items-center">

							<a th:href="@{'/cart/cartQuantityUpdate?sy=de&cid='+${cart.id}}"
							   class="btn btn-outline-secondary btn-sm">
								<i class="fa-solid fa-minus"></i>
							</a>

							<span class="mx-3 fw-bold"
								  th:text="${cart.quantity}">
                            </span>

							<a th:href="@{'/cart/cartQuantityUpdate?sy=in&cid='+${cart.id}}"
							   class="btn btn-outline-secondary btn-sm">
								<i class="fa-solid fa-plus"></i>
							</a>

						</div>

					</div>

					<!-- Price -->
					<div class="col-md-3 text-end">

						<h4>
							₹ <span th:text="${cart.totalPrice}"></span>
						</h4>

						<small class="text-muted">
							Unit Price :
							₹ <span th:text="${cart.product.discountPrice}"></span>
						</small>

					</div>

				</div>

				<div class="text-end mt-4">

					<h3>
						Total :
						<span th:text="${totalOrderPrice}"></span>
					</h3>

					<a href="/order/"
					   class="btn btn-warning">
						Proceed Payment
					</a>

				</div>

			</div>

		</div>

	</div>

</section>

</body>
</html>
