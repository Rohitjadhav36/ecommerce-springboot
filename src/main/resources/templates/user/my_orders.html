<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
	<meta charset="UTF-8">
</head>
<body>
	<section>
		<div class="container mt-5">

			<h2 class="mb-4">My Orders</h2>


			<th:block th:each="o : ${orders}">

				<div class="card shadow-sm mb-4">

					<div class="card-header bg-light">

						<div class="row">

							<div class="col-md-3">
								<small class="text-muted">ORDER PLACED</small>
								<div>[[${o.orderDate}]]</div>
							</div>

							<div class="col-md-3">
								<small class="text-muted">ORDER ID</small>
								<div>[[${o.orderId}]]</div>
							</div>

							<div class="col-md-3">
								<small class="text-muted">STATUS</small>

								<span class="badge bg-success"
									  th:if="${o.status=='Delivered'}">
                            Delivered
                        </span>

								<span class="badge bg-warning text-dark"
									  th:if="${o.status=='In Progress'}">
                            In Progress
                        </span>

								<span class="badge bg-danger"
									  th:if="${o.status=='Cancelled'}">
                            Cancelled
                        </span>

								<span th:unless="${o.status=='Delivered' || o.status=='Cancelled' || o.status=='In Progress'}">
                            [[${o.status}]]
                        </span>

							</div>

							<div class="col-md-3 text-end">
								<strong>
									₹ [[${o.price * o.quantity}]]
								</strong>
							</div>

						</div>

					</div>

					<div class="card-body">

						<div class="row align-items-center">

							<!-- Product Image -->

							<div class="col-md-2 text-center">

								<img th:src="@{'/img/product_img/'+${o.product.image}}"
									 class="img-fluid order-img">

							</div>

							<!-- Product Details -->

							<div class="col-md-7">

								<h5 class="fw-bold">
									[[${o.product.title}]]
								</h5>

								<p class="text-muted">
									[[${o.product.description}]]
								</p>

								<p class="mb-1">
									<strong>Quantity :</strong>
									[[${o.quantity}]]
								</p>

								<p>
									<strong>Price :</strong>
									₹ [[${o.price}]]
								</p>

							</div>

							<!-- Actions -->

							<div class="col-md-3 text-end">

								<th:block th:if="${o.status!='Cancelled' && o.status!='Delivered'}">

									<a th:href="@{'/order/update-status?id='+${o.id}+'&st=6'}"
									   class="btn btn-outline-danger">

										Cancel Order

									</a>

								</th:block>

								<th:block th:if="${o.status=='Cancelled'}">

									<button class="btn btn-danger" disabled>
										Cancelled
									</button>

								</th:block>

								<th:block th:if="${o.status=='Delivered'}">

									<button class="btn btn-success" disabled>
										Delivered
									</button>

								</th:block>

							</div>

						</div>

					</div>

				</div>

			</th:block>

		</div>

	</section>
</body>
</html>
